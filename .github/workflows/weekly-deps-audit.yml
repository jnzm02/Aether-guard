name: Weekly Dependency Audit

# Checks Go modules and Python requirements for known vulnerabilities. Report-only:
# findings are written to the job summary rather than hard-failing, so the workflow
# doesn't stay permanently red — review the summary and open fixes as needed.

on:
  schedule:
    - cron: "0 7 * * 1"   # Mondays 07:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  go-vuln:
    name: Go — govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go services
        run: |
          echo '## Go vulnerabilities (govulncheck)' >> "$GITHUB_STEP_SUMMARY"
          for svc in services/target-service services/event-tracker; do
            echo "### $svc" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            (cd "$svc" && "$(go env GOPATH)/bin/govulncheck" ./... 2>&1) >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done

  python-audit:
    name: Python — pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit Python requirements
        run: |
          echo '## Python vulnerabilities (pip-audit)' >> "$GITHUB_STEP_SUMMARY"
          for req in services/agent/requirements.txt services/listener/requirements.txt; do
            echo "### $req" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            pip-audit -r "$req" >> "$GITHUB_STEP_SUMMARY" 2>&1 || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
