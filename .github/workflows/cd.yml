name: CD (Production Deployment)

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

env:
  REGISTRY: ${{ secrets.DOCKER_REGISTRY }}
  IMAGE_TAG: ${{ github.sha }}
  ENVIRONMENT: ${{ github.event.inputs.environment || 'production' }}

jobs:
  # ── 1. Build & Push Docker Images to Private Registry ──────────────────────
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Send Telegram notification - Deployment started
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="🚀 *Aether-Guard Deployment Started*%0A%0A📦 *Environment:* \`${{ github.event.inputs.environment || 'production' }}\`%0A🔖 *Commit:* \`${GITHUB_SHA:0:7}\`%0A👤 *Triggered by:* ${{ github.actor }}%0A🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Private Registry
        run: |
          echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} \
            -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

      - name: Build & Push target-service
        uses: docker/build-push-action@v5
        with:
          context: ./services/target-service
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/target-service:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/target-service:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/target-service:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/target-service:buildcache,mode=max

      - name: Build & Push listener
        uses: docker/build-push-action@v5
        with:
          context: ./services/listener
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/listener:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/listener:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/listener:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/listener:buildcache,mode=max

      - name: Build & Push agent
        uses: docker/build-push-action@v5
        with:
          context: ./services/agent
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/agent:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/agent:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/agent:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/agent:buildcache,mode=max

      - name: Build & Push event-tracker
        uses: docker/build-push-action@v5
        with:
          context: ./services/event-tracker
          push: true
          tags: |
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/event-tracker:${{ github.sha }}
            ${{ secrets.DOCKER_REGISTRY }}/aether-guard/event-tracker:latest
          cache-from: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/event-tracker:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_REGISTRY }}/aether-guard/event-tracker:buildcache,mode=max

      - name: Send Telegram notification - Build completed
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="✅ *Build & Push Completed*%0A%0A📦 Images pushed to registry:%0A\`• target-service:${GITHUB_SHA:0:7}\`%0A\`• listener:${GITHUB_SHA:0:7}\`%0A\`• agent:${GITHUB_SHA:0:7}\`%0A\`• event-tracker:${GITHUB_SHA:0:7}\`%0A%0A⏭️ Next: Deploying to server..."
          fi

      - name: Send Telegram notification - Build failed
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="❌ *Build Failed*%0A%0A🔖 *Commit:* \`${GITHUB_SHA:0:7}\`%0A🔗 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

  # ── 2. Deploy to DigitalOcean Droplet via SSH ──────────────────────────────
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}
      url: ${{ vars.APP_URL }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Create directory structure on server
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'ENDSSH'
            mkdir -p /home/user/aether-guard/{infra,scripts,backups,data}
            mkdir -p /home/user/aether-guard/infra/{prometheus,alertmanager,grafana}
          ENDSSH

      - name: Copy deployment files to server
        run: |
          # Copy docker-compose files
          scp -i ~/.ssh/deploy_key infra/docker-compose.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/infra/

          scp -i ~/.ssh/deploy_key infra/docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/infra/

          # Copy prometheus config
          scp -i ~/.ssh/deploy_key -r infra/prometheus \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/infra/

          # Copy alertmanager config
          scp -i ~/.ssh/deploy_key -r infra/alertmanager \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/infra/

          # Copy grafana config
          scp -i ~/.ssh/deploy_key -r infra/grafana \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/infra/

          # Copy deployment script
          scp -i ~/.ssh/deploy_key scripts/deploy.sh \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/scripts/

      - name: Copy environment configuration
        run: |
          # Create production .env file from secrets
          cat > .env.production << EOF
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          REDIS_PASSWORD=${{ secrets.REDIS_PASSWORD }}
          CLAUDE_MODEL=claude-sonnet-4-5-20250929
          CONFIDENCE_THRESHOLD=0.75
          DRY_RUN=false
          POLL_INTERVAL=10
          DOCKER_REGISTRY=${{ secrets.DOCKER_REGISTRY }}
          DOCKER_REGISTRY_USERNAME=${{ secrets.DOCKER_REGISTRY_USERNAME }}
          DOCKER_REGISTRY_PASSWORD=${{ secrets.DOCKER_REGISTRY_PASSWORD }}
          IMAGE_TAG=${{ github.sha }}
          EOF

          scp -i ~/.ssh/deploy_key .env.production \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/home/user/aether-guard/.env

      - name: Deploy application
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/user/aether-guard

            # Login to private registry
            echo "${{ secrets.DOCKER_REGISTRY_PASSWORD }}" | docker login ${{ secrets.DOCKER_REGISTRY }} \
              -u "${{ secrets.DOCKER_REGISTRY_USERNAME }}" --password-stdin

            # Run deployment script
            chmod +x scripts/deploy.sh
            ./scripts/deploy.sh ${{ github.sha }}
          EOF

      - name: Health check
        run: |
          echo "Waiting 30s for services to start..."
          sleep 30

          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            # Check all service health endpoints
            curl -sf http://localhost:8080/health || exit 1
            curl -sf http://localhost:8081/health || exit 1
            curl -sf http://localhost:8082/health || exit 1
            curl -sf http://localhost:9090/-/healthy || exit 1
            curl -sf http://localhost:9093/-/healthy || exit 1

            echo "✅ All services are healthy!"
          EOF

      - name: Send Telegram notification - Deployment succeeded
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="🎉 *Deployment Successful!*%0A%0A✅ All services are healthy%0A🔖 *Version:* \`${GITHUB_SHA:0:7}\`%0A🌐 *Environment:* \`${{ github.event.inputs.environment || 'production' }}\`%0A👤 *Triggered by:* ${{ github.actor }}%0A%0A📊 [View Grafana](https://monitor.aether-guard.com)%0A🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Send Telegram notification - Deployment failed
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="❌ *Deployment Failed*%0A%0A🔖 *Commit:* \`${GITHUB_SHA:0:7}\`%0A🌐 *Environment:* \`${{ github.event.inputs.environment || 'production' }}\`%0A%0A🔧 Check logs and initiate rollback if needed%0A🔗 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ── 3. Post-Deployment Verification ────────────────────────────────────────
  verify:
    name: Verify Deployment
    runs-on: ubuntu-latest
    needs: deploy
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Check running containers
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "=== Running Containers ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Image}}"

            echo ""
            echo "=== Disk Usage ==="
            df -h /home/user/aether-guard

            echo ""
            echo "=== Recent Logs (last 20 lines) ==="
            cd /home/user/aether-guard/infra
            docker compose logs --tail=20
          EOF

      - name: Test Prometheus targets
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            echo "=== Prometheus Targets ==="
            curl -sf "http://localhost:9090/api/v1/targets" | jq '.data.activeTargets[] | {job: .labels.job, health: .health}'
          EOF

      - name: Send Telegram notification - Verification complete
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="✅ *Verification Complete*%0A%0A📋 All containers running%0A📈 Prometheus targets healthy%0A💾 Disk space OK%0A%0A🚀 Deployment fully operational!"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

  # ── 4. Rollback (Manual Trigger Only) ───────────────────────────────────────
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    if: failure() && (github.event.inputs.environment == 'production' || github.event_name == 'push')
    needs: [deploy, verify]
    environment:
      name: ${{ github.event.inputs.environment || 'production' }}

    steps:
      - name: Send Telegram notification - Rollback started
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="⚠️ *Automatic Rollback Initiated*%0A%0A🔖 *Failed commit:* \`${GITHUB_SHA:0:7}\`%0A⏪ Rolling back to previous version..."
          fi

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Execute rollback
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /home/user/aether-guard

            echo "⚠️  Rolling back to previous deployment..."

            # Restore previous .env backup
            if [ -f .env.backup ]; then
              cp .env.backup .env
              echo "✅ Restored previous environment configuration"
            fi

            # Restore previous docker-compose state
            cd infra

            # Clean up thoroughly to avoid container name conflicts
            docker compose down --remove-orphans
            docker ps -a --filter "name=redis" --filter "name=postgres" --filter "name=agent" \
                --filter "name=tempo" --filter "name=grafana" --filter "name=prometheus" \
                --filter "name=alertmanager" --filter "name=listener" --filter "name=target-service" \
                --filter "name=event-tracker" --format "{{.ID}}" | xargs -r docker rm -f 2>/dev/null || true

            docker compose up -d

            echo "✅ Rollback complete. Verify services:"
            docker compose ps
          EOF

      - name: Send Telegram notification - Rollback complete
        if: success()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="✅ *Rollback Successful*%0A%0A⏪ System restored to previous version%0A📋 Please review logs and investigate failure%0A🔗 [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Send Telegram notification - Rollback failed
        if: failure()
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TELEGRAM_BOT_TOKEN }}" ]; then
            curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
              -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
              -d parse_mode="Markdown" \
              -d text="🚨 *CRITICAL: Rollback Failed*%0A%0A⚠️ Manual intervention required!%0A🔖 *Failed commit:* \`${GITHUB_SHA:0:7}\`%0A%0A🔧 SSH into server immediately%0A🔗 [View Logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          fi

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key
