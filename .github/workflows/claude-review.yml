name: Claude PR Review

# Automatic first-pass review on every non-draft PR. Posts a single review comment;
# it does not approve or merge. Reuses this repo's harness: the safety-reviewer
# subagent for agent changes, and knowledge of what CI enforces.
#
# Requires repository secret ANTHROPIC_API_KEY.

on:
  pull_request:
    types: [opened, reopened, synchronize]

concurrency:
  # Supersede an in-flight review when new commits are pushed to the same PR.
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    # TEMPORARY: don't fail the PR while the ANTHROPIC_API_KEY repo secret is not yet
    # a valid, funded key. Until then the review step errors (cost $0 / 0 turns) and
    # this keeps it from showing a red check. Remove this line once the key works so
    # real review failures surface again. See docs/CLAUDE_GITHUB_ACTION.md.
    continue-on-error: true
    permissions:
      contents: read
      pull-requests: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Claude review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Built-in token → no Claude GitHub App install required for reviews.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            You are reviewing a pull request for Aether-Guard, an autonomous AI SRE
            agent that takes real remediation actions. Read the PR diff and give a
            focused, high-signal review.

            Priorities, in order:
            1. Safety. For any change under services/agent/ that touches policy.py,
               remediation.py, verification.py, DRY_RUN, confidence thresholds, or
               approval/rollback logic, use the `safety-reviewer` subagent and treat
               any weakening of the 6-layer defense pipeline as a blocking concern.
            2. Correctness bugs that would cause wrong behavior at runtime.
            3. CI: flag changes likely to fail the checks in .github/workflows/ci.yml
               (ruff on agent/listener/scripts; go build/vet/test -race for
               target-service; promtool/amtool config validation).

            Rules:
            - Report only real, high-confidence issues, each with file:line and a
              concrete failure scenario. Rank most-severe first.
            - If the PR looks good, say so briefly instead of inventing nits.
            - Do NOT approve, merge, or push commits — just leave one review comment.
          # Pin a model the account has access to. The action's default can be a
          # brand-new model (e.g. an opus-*[1m] preview) that a key without that
          # entitlement can't call — which fails the run with cost 0 / is_error.
          claude_args: '--model claude-sonnet-4-5 --max-turns 20'
