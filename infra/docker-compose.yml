# ─────────────────────────────────────────────────────────────────────────────
# Aether-Guard — Full Stack (Phases 1-3)
#
# Services:
#   target-service  :8080   The intentionally-breakable Go microservice
#   prometheus      :9090   Scrapes /metrics every 15s
#   alertmanager    :9093   Routes SLO alerts to the listener
#   listener        :8081   Python webhook receiver + enrichment
#   agent           :8082   AI SRE Agent (Claude-powered RCA)
#
# Secrets: copy .env.example → .env and fill in ANTHROPIC_API_KEY
# ─────────────────────────────────────────────────────────────────────────────
version: "3.9"

# Docker Compose automatically loads .env from the project root (one level up).
# Run from the repo root:  docker compose -f infra/docker-compose.yml up
# Or set env_file explicitly below if running from infra/ directory.


networks:
  aether-net:
    driver: bridge

volumes:
  prometheus_data:
  agent_data:
  grafana_data:
  redis_data:
  postgres_data:
  tempo_data:

services:

  # ── The "Broken" Service ──────────────────────────────────────────────────
  target-service:
    build:
      context: ../services/target-service
      dockerfile: Dockerfile
    image: aether-guard/target-service:latest
    container_name: target-service
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    restart: unless-stopped
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "target-service"
      com.aether-guard.phase: "1"

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro  # Rules pre-rendered, can be read-only
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=7d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    restart: unless-stopped
    networks:
      - aether-net
    depends_on:
      target-service:
        condition: service_healthy
    labels:
      com.aether-guard.component: "prometheus"
      com.aether-guard.phase: "1-2"

  # ── Alertmanager ──────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.26.0
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--log.level=info"
    restart: unless-stopped
    networks:
      - aether-net
    labels:
      com.aether-guard.component: "alertmanager"
      com.aether-guard.phase: "2"

  # ── Alert Listener (Python) ────────────────────────────────────────────────
  listener:
    build:
      context: ../services/listener
      dockerfile: Dockerfile
    image: aether-guard/listener:latest
    container_name: listener
    ports:
      - "8081:8081"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - TARGET_CONTAINER=target-service
      - MAX_QUEUE_SIZE=500
    env_file:
      - ../.env
    volumes:
      # Mount Docker socket so the listener can fetch container logs.
      - /var/run/docker.sock:/var/run/docker.sock:ro
    restart: unless-stopped
    networks:
      - aether-net
    depends_on:
      - prometheus
      - alertmanager
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8081/health')\""]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "listener"
      com.aether-guard.phase: "2"

  # ── Redis (V2 State Store) ────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      # SECURITY: Bind to localhost only to prevent public exposure
      # Remove this line entirely for production deployments (use internal network only)
      - "127.0.0.1:6379:6379"
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    command: >
      sh -c "redis-server
      --appendonly yes
      --appendfsync everysec
      --requirepass \"$${REDIS_PASSWORD}\""
    restart: unless-stopped
    networks:
      - aether-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "$REDIS_PASSWORD", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      com.aether-guard.component: "redis"
      com.aether-guard.phase: "3-v2"

  # ── Postgres (Incident Report Store) ──────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      # SECURITY: Bind to localhost only to prevent public exposure
      # Remove this line entirely for production deployments (use internal network only)
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=aether_guard
      - POSTGRES_USER=aether_guard
      - POSTGRES_PASSWORD=local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aether_guard -d aether_guard"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "postgres"
      com.aether-guard.phase: "3-v2"

  # ── AI SRE Agent (Phase 3) ────────────────────────────────────────────────
  agent:
    build:
      context: ../services/agent
      dockerfile: Dockerfile
    image: aether-guard/agent:latest
    container_name: agent
    ports:
      - "8082:8082"
    env_file:
      - ../.env        # loads ANTHROPIC_API_KEY, VOYAGE_API_KEY, REDIS_PASSWORD + optional overrides
    environment:
      - LISTENER_URL=http://listener:8081
      - ANALYSIS_LOG_PATH=/app/data/analyses.jsonl
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - POSTGRES_URL=postgresql://aether_guard:local_dev_password@postgres:5432/aether_guard
      - SIMILARITY_MIN_CONFIDENCE=0.7  # Priority 8: Min confidence for RAG similarity search
      - RAG_ENABLED=true               # Priority 8: Enable RAG investigation graph
      - RAG_MAX_ITERATIONS=2           # Priority 8: Max refine cycles (hard iteration cap)
      - RAG_CONFIDENCE_THRESHOLD=0.75  # Priority 8: Min confidence to finalize without refinement
    volumes:
      - agent_data:/app/data
    restart: unless-stopped
    networks:
      - aether-net
    depends_on:
      listener:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8082/health')\""]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "agent"
      com.aether-guard.phase: "3"

  # ── Event Tracker (Priority 9: Real-Traffic Validation) ──────────────────
  event-tracker:
    build:
      context: ../services/event-tracker
      dockerfile: Dockerfile
    image: aether-guard/event-tracker:latest
    container_name: event-tracker
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
      - GITHUB_TOKEN=${GITHUB_TOKEN}  # Optional: raises rate limit 60→5000/hour
    restart: unless-stopped
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8083/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "event-tracker"
      com.aether-guard.phase: "9-priority9"

  # ── Grafana Tempo (Distributed Tracing) ──────────────────────────────────
  tempo:
    image: grafana/tempo:2.3.1
    container_name: tempo
    ports:
      - "3200:3200"  # Tempo HTTP API
      - "4317:4317"  # OTLP gRPC
      - "4318:4318"  # OTLP HTTP
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml:ro
      - tempo_data:/tmp/tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    restart: unless-stopped
    networks:
      - aether-net
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3200/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    labels:
      com.aether-guard.component: "tempo"
      com.aether-guard.phase: "5-priority5"

  # ── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.3.1
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=aether-guard
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/aether-guard-slo.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
    networks:
      - aether-net
    depends_on:
      - prometheus
      - tempo
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      com.aether-guard.component: "grafana"
      com.aether-guard.phase: "5"
