# ─────────────────────────────────────────────────────────────────────────────
# Redis Authentication Secret
#
# SECURITY: This is a template file. Generate the actual secret with:
#   kubectl create secret generic redis-password \
#     --from-literal=password=$(openssl rand -base64 32) \
#     -n aether-guard
#
# DO NOT commit actual passwords to version control!
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: redis-password
  namespace: aether-guard
  labels:
    app: redis
type: Opaque
data:
  # Base64-encoded password
  # Generate with: echo -n "your_secure_password" | base64
  # REPLACE THIS IN PRODUCTION!
  password: Y2hhbmdlLW1lLWluLXByb2R1Y3Rpb24=
